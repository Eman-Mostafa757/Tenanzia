<div class="min-h-screen bg-[#0D0D0F] flex items-center justify-center">
  <div class="w-full max-w-md">

    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#D4537E] mb-4">
        <span class="text-white font-medium text-lg">T</span>
      </div>
      <h1 class="text-2xl font-medium text-[#F0F0F2]">Welcome back</h1>
      <p class="text-[#666] text-sm mt-1">Sign in to your Tenanzia account</p>
    </div>

    <div class="bg-[#111114] border border-[#1E1E24] rounded-2xl p-8">

      <!-- Error Message -->
      <div *ngIf="error" class="mb-5 bg-[#3C1528] border border-[#D4537E] text-[#ED93B1] text-sm px-4 py-3 rounded-xl">
        {{ error }}
      </div>

      <div class="mb-5">
        <label class="block text-xs text-[#666] uppercase tracking-wider mb-2">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="you@company.com"
          class="w-full bg-[#0D0D0F] border border-[#1E1E24] rounded-xl px-4 py-3 text-[#F0F0F2] text-sm placeholder-[#333] focus:outline-none focus:border-[#D4537E] transition-colors"
        />
      </div>

      <div class="mb-8">
        <label class="block text-xs text-[#666] uppercase tracking-wider mb-2">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          class="w-full bg-[#0D0D0F] border border-[#1E1E24] rounded-xl px-4 py-3 text-[#F0F0F2] text-sm placeholder-[#333] focus:outline-none focus:border-[#D4537E] transition-colors"
        />
      </div>
      <p class="text-center text-[#666] text-sm mt-4">
  <a routerLink="/forgot-password" class="text-[#D4537E] hover:text-[#E4638E]">
    Forgot password?
  </a>
</p>

      <button
        (click)="onLogin()"
        [disabled]="loading"
        class="w-full bg-[#D4537E] hover:bg-[#C4436E] disabled:opacity-50 text-white rounded-xl py-3 text-sm font-medium transition-colors">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>

      <p class="text-center text-[#666] text-sm mt-6">
        Don't have an account?
<a routerLink="/register" class="text-[#D4537E] hover:text-[#E4638E]">Create one</a>
      </p>
    </div>

  </div>
</div>
